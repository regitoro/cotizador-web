<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotizador Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Noto+Sans+KR:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"/>
  </head>

  <body>
    <nav class="navbar">

      <button class="show-window">Abrir</button>

      <div class="logo">
        <h1>Cotizador Web</h1>
      </div>

      <div class="menu-dav">
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="#">Servicio</a></li>
          <li><a href="#">Contactos</a></li>
        </ul>
      </div>
    
  </nav>

  <!--titulo-->
    <div class="titulo">
      <h4>PROYECTO INTRODUCTORIO</h4>
      <h1>Formulario de cotizacion</h1>
      <h5>Completa el formulario para generar una cotizacion estimada</h5>
    </div>

    <!---contendor-->
    <div class="container">

      <!---warning window-->
        <div class="window not-show">
            <div class="windowHeader">
                <p>Advertencia</p>
                <div><button id="window-closed">X</button></div>
            </div>

            <div class="windowContent">
                <p>Error</p>
                <button>OK</button>
                </div>
        </div>
      
      <div class="cotizacion">
        <label for="nombre">Nombre del cliente:</label>
        <input type="text" id="nombre" name="nombre" />

        <br /><br />

        <label for="nombre">Nombre de paginas:</label>
        <input type="number" id="numero" name="numero" />

        <br /><br />
        <label for="dominio"
          >Dominio:
          <input
            class="from-check-input"
            type="checkbox"
            id="dominio"
            name="dominio"
            data-precio="1500"
          />
        </label>

        <br /><br />
        <label for="hosting"
          >Hosting:
          <input
            class="from-check-input"
            type="checkbox"
            id="hosting"
            name="hosting"
            data-precio="600"
          />
        </label>

        <br /><br />
        <label for="pagina-web"
          >Pagina web:
          <input
            class="form-check-input"
            type="checkbox"
            id="pagina-web"
            name="pagina-web"
            data-precio="5000"
          />
        </label>

        <br /><br />
        <label for="pagina-ad"
          >Pagina adicional:
          <input
            class="form-check-input"
            type="checkbox"
            id="pagina-ad"
            name="pagina-ad"
            data-precio="2000"
          />
        </label>

        <br /><br />
        <label for="SEO"
          >SEO:
          <input
            class="form-check-input"
            type="checkbox"
            id="SEO"
            name="SEO"
            data-precio="2000"
          />
        </label>

        <br /><br />
        <label for="bd/cms"
          >BD / CMS:
          <input
            class="form-check-input"
            type="checkbox"
            id="bdcms"
            name="bdcms"
            data-precio="7000"
          />
        </label>

        <br /><br />
        <label for="cambios"
          >Cambios por DEV:
          <input
            class="form-check-input"
            type="checkbox"
            id="cambios"
            name="cambios"
            data-precio="500"
          />
        </label>

        <div class="calculate-button">
          <button>Calcular cotizacion</button>
        </div>

      </div>

      <br /><br />
      <div class="total">Total: <span id="total">0</span></div>

      
    </div>

    
    <div class="footer">
      <div class="year">2026 derechos reservados</div>
      uvaq
    </div>


    <script>
      const dominio = document.querySelector("#dominio");
      const hosting = document.querySelector("#hosting");
      const paginaWeb = document.querySelector("#pagina-web");
      const paginaAd = document.querySelector("#pagina-ad");
      const seo = document.querySelector("#SEO");
      const bdcms = document.querySelector("#bdcms");
      const cambios = document.querySelector("#cambios");

      var showWindow = document.querySelector(".show-window");
      var closeWindow = document.querySelector("#window-closed");

      var total = 0;

      var win = document.querySelector(".window");

      
      showWindow.addEventListener("click", function()
      {
        console.log("not-show")
        win.classList.add("show");
      })

      closeWindow.addEventListener("click", function() 
      {
          win.classList.remove("show");
          win.classList.add("not-show");
        });

      //const pages=document.querySelector("#.check-pages");

      //evento click
      hosting.addEventListener("click", function () {
        if (hosting.checked) {
          total += parseInt(hosting.dataset.precio);
          console.log(" Hosting seleccionado, Total: " + total);
        } else {
          total-=parseInt(hosting.dataset.precio)
          console.log("hosting no seleccionado");
        }
        document.getElementById("total").textContent = total;
      })

      dominio.addEventListener("click", function () {
        if (dominio.checked) {
          total += parseInt(dominio.dataset.precio);
          console.log(" Dominio seleccionado, Total: " + total);
        } else {
          total-=parseInt(dominio.dataset.precio)
          console.log("dominip no seleccionado");
        }
        document.getElementById("total").textContent = total;
      })

      paginaWeb.addEventListener("click", function () {
        if (paginaWeb.checked) {
          total += parseInt(paginaWeb.dataset.precio);
          console.log("Pagina web seleccionado, Total: " + total);
        } else {
          total-=parseInt(paginaWeb.dataset.precio)
          console.log("Pagina web no seleccionado");
        }
        document.getElementById("total").textContent = total;
      })

      paginaAd.addEventListener("click", function () {
        if (paginaAd.checked) {
          total += parseInt(paginaAd.dataset.precio);
          console.log("Pagina adicional seleccionado, Total: " + total);
        } else {
          total-=parseInt(paginaAd.dataset.precio)
          console.log("Pagina adicional no seleccionado");
        }
        document.getElementById("total").textContent = total;
      })

      SEO.addEventListener("click", function () {
        if (SEO.checked) {
          total += parseInt(SEO.dataset.precio);
          console.log("SEO adicional seleccionado, Total: " + total);
        } else {
          total-=parseInt(SEO.dataset.precio)
          console.log("SEO adicional no seleccionado");
        }
        document.getElementById("total").textContent = total;
      })

      bdcms.addEventListener("click", function () {
        if (bdcms.checked) {
          total += parseInt(bdcms.dataset.precio);
          console.log("BD/CMS adicional seleccionado, Total: " + total);
        } else {
          total-=parseInt(bdcms.dataset.precio)
          console.log("BD/CMS adicional no seleccionado");
        }
        document.getElementById("total").textContent = total;
      })

      cambios.addEventListener("click", function () {
        if (cambios.checked) {
          total += parseInt(cambios.dataset.precio);
          console.log("Cambios seleccionado, Total: " + total);
        } else {
          total-=parseInt(cambios.dataset.precio)
          console.log("Cmabios no seleccionado");
        }
        document.getElementById("total").textContent = total;
      })

      //pruebas
      console.log(dominio.dataset.precio + ", " + hosting.dataset.precio);

      //suma numeros
      console.log(
        Number(dominio.dataset.precio) + Number(hosting.dataset.precio),
      );
    </script>
  </body>
</html>
